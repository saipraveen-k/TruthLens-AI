<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TruthLens AI - News Credibility Analyzer</title>
    <meta name="description" content="Advanced AI-powered news credibility analyzer helping you detect misinformation and bias. Detect. Analyze. Trust.">
    <meta name="keywords" content="fake news, credibility analyzer, AI, misinformation, bias detection, news verification">
    <meta name="author" content="TruthLens AI Team">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://truthlens.ai">
    <meta property="og:title" content="TruthLens AI - News Credibility Analyzer">
    <meta property="og:description" content="Advanced AI-powered news credibility analyzer helping you detect misinformation and bias.">
    <meta property="og:image" content="https://truthlens.ai/og-image.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://truthlens.ai">
    <meta property="twitter:title" content="TruthLens AI - News Credibility Analyzer">
    <meta property="twitter:description" content="Advanced AI-powered news credibility analyzer helping you detect misinformation and bias.">
    <meta property="twitter:image" content="https://truthlens.ai/twitter-image.png">

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- Preconnect to improve performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="manifest" href="/manifest.json">
    
    <!-- Theme color -->
    <meta name="theme-color" content="#667eea">
    
    <!-- Prevent FOUC (Flash of Unstyled Content) -->
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        #root {
            display: flex;
            min-height: 100vh;
        }
        
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <noscript>
        <div style="text-align: center; padding: 50px; background: white; color: #333;">
            <h1>JavaScript Required</h1>
            <p>TruthLens AI requires JavaScript to function properly. Please enable JavaScript in your browser settings.</p>
        </div>
    </noscript>
    
    <div id="root">
        <!-- Loading screen -->
        <div class="loading">
            <div class="loading-spinner"></div>
        </div>
    </div>

    <!-- Main React app will be loaded here -->
    <script type="module" src="/src/index.js"></script>
</body>
</html>
